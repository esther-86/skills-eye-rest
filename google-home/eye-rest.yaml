metadata:
  name: Eye Rest — 90-minute screen session
  description: Announces 30-second eye breaks during a 90-minute screen-use session.

automations:
  starters:
    - type: assistant.event.OkGoogle
      eventData: query
      is: start eye rest

  actions:
    - type: assistant.command.Broadcast
      message: Eye Rest has started. Look 20 feet away when you hear each eye break. The full screen-use session ends in 90 minutes.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming for the last eight minutes.

    - type: time.delay
      for: 8min
    - type: assistant.command.Broadcast
      message: Eye Rest is complete. Your 90-minute screen-use session has ended. Consider taking a longer break before returning to the screen.
