metadata:
  name: Vision Stop — five focus periods
  description: Announces 30-second eye breaks between five 20-minute focus periods.

automations:
  starters:
    - type: assistant.event.OkGoogle
      eventData: query
      is: start vision stop

  actions:
    - type: assistant.command.Broadcast
      message: Vision Stop has started. Look 20 feet away when you hear each eye break. Five focus periods end in 102 minutes.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your screen-use timer is resuming now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Eye rest break. Look away from the screen at something at least 20 feet away. Keep looking away for 30 seconds.
    - type: time.delay
      for: 30sec
    - type: assistant.command.Broadcast
      message: Your eye break is complete. Your fifth 20-minute focus period is starting now.

    - type: time.delay
      for: 20min
    - type: assistant.command.Broadcast
      message: Vision Stop is complete. Your five focus periods have ended. Consider taking a longer break before returning to the screen.
